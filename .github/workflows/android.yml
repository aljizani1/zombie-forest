# كل ما ترفع تعديل على main: GitHub يبني ملف APK ونسخة المتصفح، يحط الـ APK بـ Releases، ويحدّث صفحة التحميل واللعب.
name: Build APK + Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Godot + export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: zombie
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p build
          ./godot --headless --import || true
          ./godot --headless --export-release "Android" build/zombie-forest.apk
          ls -la build/zombie-forest.apk

      # نسخة المتصفح: تنحط بصفحة التحميل تحت /play/
      - name: Export Web
        run: |
          mkdir -p build/web
          ./godot --headless --export-release "Web" build/web/index.html
          mkdir -p web/play
          cp -r build/web/* web/play/
          # نسخة جديدة بكل بناء: ملف اللعبة يتحمّل برقم جديد حتى المتصفح ما يستعمل القديم
          sed -i "s|\"executable\":\"index\"|\"executable\":\"index\",\"mainPack\":\"index.pck?v=${GITHUB_SHA::8}\"|" web/play/index.html
          sed -i "s|src=\"index.js\"|src=\"index.js?v=${GITHUB_SHA::8}\"|" web/play/index.html
          # الأجهزة اللي عندها النسخة القديمة محفوظة (service worker): هذا الملف يمسحها ويحدّث الصفحة
          cat > web/play/index.service.worker.js <<'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil((async () => {
            for (const k of await caches.keys()) await caches.delete(k);
            await self.registration.unregister();
            for (const c of await self.clients.matchAll({ type: 'window' })) c.navigate(c.url);
          })()));
          EOF
          grep -o '"mainPack":"[^"]*"' web/play/index.html
          ls -la web/play

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: زومبي الغابة ${{ github.run_number }}
          files: build/zombie-forest.apk
          make_latest: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  pages:
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
